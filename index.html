<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nomaecraft v2</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="/src/style.scss" />
</head>
<body>
  <!-- Main Menu -->
  <div id="main-menu">
    <div id="menu-card">
      <img src="logo.png" alt="Nomaecraft" id="menu-logo" />
      <h1 id="menu-title">Nomaecraft <span class="v2">v2</span></h1>
      <p id="menu-sub">A multiplayer voxel sandbox</p>
      <button id="btn-singleplayer" class="menu-btn primary">Singleplayer</button>
      <button id="btn-multiplayer" class="menu-btn">Multiplayer</button>
      <div id="menu-links">
        <button id="github" class="link-btn">GitHub</button>
      </div>
    </div>
  </div>

  <!-- Singleplayer: World Select -->
  <div id="world-select" style="display:none">
    <div id="ws-card">
      <h2>Select World</h2>
      <div id="world-list"></div>
      <div id="ws-buttons">
        <button id="btn-create-world" class="menu-btn primary">Create New World</button>
        <button id="btn-ws-back" class="menu-btn">Back</button>
      </div>
    </div>
  </div>

  <!-- Singleplayer: Create World -->
  <div id="create-world" style="display:none">
    <div id="cw-card">
      <h2>Create New World</h2>
      <div class="form-row">
        <label for="cw-name">World Name</label>
        <input id="cw-name" type="text" maxlength="24" placeholder="My World" autocomplete="off" />
      </div>
      <div class="form-row">
        <label for="cw-seed">Seed</label>
        <input id="cw-seed" type="text" maxlength="16" placeholder="Random" autocomplete="off" />
      </div>
      <div class="form-row">
        <label for="cw-name-input">Player Name</label>
        <input id="cw-player-name" type="text" maxlength="16" placeholder="Steve" autocomplete="off" />
      </div>
      <div id="cw-buttons">
        <button id="btn-cw-create" class="menu-btn primary">Create &amp; Play</button>
        <button id="btn-cw-back" class="menu-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Multiplayer -->
  <div id="multi-menu" style="display:none">
    <div id="mm-card">
      <h2>Multiplayer</h2>
      <div class="form-row">
        <label for="mm-name">Player Name</label>
        <input id="mm-name" type="text" maxlength="16" placeholder="Steve" autocomplete="off" />
      </div>
      <div id="mm-buttons">
        <button id="btn-mm-join" class="menu-btn primary">Join Shared World</button>
        <button id="btn-mm-back" class="menu-btn">Back</button>
      </div>
    </div>
  </div>

  <!-- Loading Screen -->
  <div id="loading" style="display:none">
    <div id="loading-inner">
      <p id="loading-text">Generating world...</p>
      <div id="loading-bar-outer">
        <div id="loading-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- HUD (in-game overlay) -->
  <div id="hud" style="display:none">
    <div id="crosshair">+</div>
    <div id="hotbar">
      <div id="hotbar-slots"></div>
      <div id="hotbar-active"></div>
    </div>
    <div id="stat-bars">
      <div id="health-bar" class="stat-bar"><span id="health-val"></span></div>
      <div id="hunger-bar" class="stat-bar"><span id="hunger-val"></span></div>
      <div id="air-bar" class="stat-bar" style="display:none"><span id="air-val"></span></div>
    </div>
    <div id="debug" style="display:none">
      <span id="player-pos-x"></span>
      <span id="player-pos-y"></span>
      <span id="player-pos-z"></span>
      <span id="triangle-count"></span>
      <span id="render-calls"></span>
    </div>
    <div id="player-count" style="display:none">
      <span id="player-count-text">1 player</span>
    </div>
  </div>

  <!-- Inventory Panel (toggle with E) -->
  <div id="inventory-panel" style="display:none">
    <div id="inv-title">Inventory</div>
    <div id="craft-grid-area">
      <div id="craft-label">Crafting</div>
      <div id="craft-grid"></div>
      <div id="craft-arrow">&rarr;</div>
      <div id="craft-result"></div>
    </div>
    <div id="inv-grid"></div>
    <div id="inv-hotbar"></div>
  </div>

  <!-- Chat -->
  <div id="chat-box" style="display:none">
    <div id="chat-log"></div>
    <input id="chat-input" type="text" maxlength="200" placeholder="Type a message..." autocomplete="off" />
  </div>

  <!-- Death Screen -->
  <div id="death-screen" style="display:none">
    <h1>You Died!</h1>
    <button id="respawn-btn" class="menu-btn">Respawn</button>
  </div>

  <!-- Pause Menu -->
  <div id="pause-menu" style="display:none">
    <div id="pause-card">
      <h2>Game Paused</h2>
      <button id="btn-resume" class="menu-btn primary">Resume</button>
      <button id="btn-save-quit" class="menu-btn">Save &amp; Quit</button>
    </div>
  </div>

  <div id="drag-item" style="display:none"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
